resolver 127.0.0.11 valid=10s ipv6=off;

server_tokens off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

ssl_certificate     /etc/letsencrypt/live/cinema-platform/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/cinema-platform/privkey.pem;
ssl_protocols       TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache   shared:SSL:10m;
ssl_session_timeout 1d;

proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;

server {
    listen 80;
    server_name api.cinema-platform.site media.cinema-platform.site grafana.cinema-platform.site;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.cinema-platform.site;

    client_max_body_size 20m;

    location = /metrics {
        return 404;
    }

    location / {
        set $upstream http://gateway-service:4000;
        proxy_pass $upstream;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name media.cinema-platform.site;

    client_max_body_size 20m;

    location / {
        set $upstream http://media-service:4200;
        proxy_pass $upstream;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name grafana.cinema-platform.site;

    location / {
        set $upstream http://grafana:3000;
        proxy_pass $upstream;
    }
}