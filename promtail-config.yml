server:
    http_listen_port: 9080
    grpc_listen_port: 0

positions:
    filename: /promtail/positions.yaml

clients:
    - url: http://loki:3100/loki/api/v1/push

scrape_configs:
    - job_name: containers
      static_configs:
          - targets: [localhost]
            labels:
                job: containers
                __path__: /var/lib/docker/containers/*/*-json.log

      pipeline_stages:
          - json:
                expressions:
                    output: log
                    stream: stream
                    time: time
                    service: attrs.tag

          - labels:
                stream:
                service:

          - timestamp:
                source: time
                format: RFC3339Nano

          - output:
                source: output

          - json:
                expressions:
                    level: level

          - template:
                source: level
                template: '{{ if eq .Value "10" }}trace{{ else if eq .Value "20" }}debug{{ else if eq .Value "30" }}info{{ else if eq .Value "40" }}warn{{ else if eq .Value "50" }}error{{ else if eq .Value "60" }}fatal{{ else }}{{ .Value }}{{ end }}'

          - labels:
                level:
