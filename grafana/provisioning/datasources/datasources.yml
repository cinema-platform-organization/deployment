apiVersion: 1

datasources:
    - name: Prometheus
      uid: prometheus
      type: prometheus
      access: proxy
      url: http://prometheus:9090
      isDefault: true
      editable: false
      jsonData:
          timeInterval: 15s

    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://loki:3100
      editable: false
      jsonData:
          maxLines: 1000
          derivedFields:
              - name: TraceID
                matcherRegex: '"trace_id":"(\w+)"'
                datasourceUid: jaeger
                url: "$${__value.raw}"

    - name: Jaeger
      uid: jaeger
      type: jaeger
      access: proxy
      url: http://jaeger:16686
      editable: false
      jsonData:
          tracesToLogsV2:
              datasourceUid: loki
              spanStartTimeShift: "-5m"
              spanEndTimeShift: "5m"
              filterByTraceID: true
              tags:
                  - key: service.name
                    value: service

    - name: Bookings DB
      uid: bookings-db
      type: postgres
      access: proxy
      url: postgres:5432
      user: grafana_reader
      editable: false
      jsonData:
          database: cinema-platform_bookings
          sslmode: disable
          postgresVersion: 1500
          maxOpenConns: 5
          maxIdleConns: 2
      secureJsonData:
          password: ${GRAFANA_DB_PASSWORD}

    - name: Payments DB
      uid: payments-db
      type: postgres
      access: proxy
      url: postgres:5432
      user: grafana_reader
      editable: false
      jsonData:
          database: cinema-platform_payments
          sslmode: disable
          postgresVersion: 1500
          maxOpenConns: 5
          maxIdleConns: 2
      secureJsonData:
          password: ${GRAFANA_DB_PASSWORD}
