global:
    scrape_interval: 15s
    evaluation_interval: 15s

scrape_configs:
    - job_name: "services"
      metrics_path: "/metrics"
      static_configs:
          - targets:
                - "gateway-service:4000"
                - "auth-service:9101"
                - "notification-service:9102"
                - "booking-service:9103"
                - "payment-service:9104"
                - "users-service:9105"
                - "movie-service:9106"
                - "theater-service:9107"
                - "screening-service:9108"

    - job_name: "postgres"
      static_configs:
          - targets:
                - "postgres-exporter:9187"

    - job_name: "redis"
      static_configs:
          - targets:
                - "redis-exporter:9121"

    - job_name: "rabbitmq"
      static_configs:
          - targets:
                - "rabbitmq-exporter:9419"

    - job_name: "node"
      static_configs:
          - targets:
                - "node-exporter:9100"

    - job_name: "prometheus"
      static_configs:
          - targets:
                - "localhost:9090"
